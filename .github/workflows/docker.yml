name: Docker

on:
  push:
    branches: [ deploy ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Get version info
      id: vars
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        BASE_TAG="${BASE_TAG#v}"
        BASE_TAG="${BASE_TAG:-dev}"
        echo "base_version=${BASE_TAG}" >> $GITHUB_OUTPUT
        echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Build and test Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: couchpotato:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run -d --name couchpotato-test -p 5051:5050 couchpotato:test
        sleep 30
        curl -f http://localhost:5051/ || (docker logs couchpotato-test && exit 1)
        docker logs couchpotato-test
        docker stop couchpotato-test
        docker rm couchpotato-test

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push to GHCR
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ steps.vars.outputs.image }}:latest
          ${{ steps.vars.outputs.image }}:develop
          ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_short }}
        platforms: linux/amd64,linux/arm64
        build-args: |
          CP_VERSION=${{ steps.vars.outputs.base_version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
